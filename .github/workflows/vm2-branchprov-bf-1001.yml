name: VM2 Branch Provenance BF 1001
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  trigger:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'VM2_BRANCHPROV_BF_1001_')
    name: vm2-branchprov-bf-trigger
    runs-on: ubuntu-latest
    steps:
      - name: Record branch provenance and fail attempt one
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_BASE_REF: ${{ github.base_ref }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          echo "EVENT_NAME=$EVENT_NAME"
          echo "PR_HEAD_REF=$PR_HEAD_REF"
          echo "PR_BASE_REF=$PR_BASE_REF"
          echo "GH_HEAD_REF=$GH_HEAD_REF"
          echo "GH_BASE_REF=$GH_BASE_REF"
          echo "GH_REF_NAME=$GH_REF_NAME"
          echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            exit 1
          fi

  write-side-effect:
    if: github.event_name == 'pull_request_target' && startsWith(github.event.pull_request.title, 'VM2_BRANCHPROV_BF_1001_')
    name: vm2-branchprov-bf-side-effect
    runs-on: ubuntu-latest
    steps:
      - name: Write controlled target-side marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"             -f body="VM2_BRANCHPROV_BF_SIDE_EFFECT attempt=$GITHUB_RUN_ATTEMPT run=$GITHUB_RUN_ID"
